<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enter Bike Details</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f0ff, #f8f9ff);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {

            width: 90%;
            max-width: 600px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {

            text-align: center;

            color: #222;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 25px;
        }

        .form-group {

            margin-bottom: 18px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        input,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        input:focus,
        select:focus {

            border-color: #4a70e8;
        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #4a70e8;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;
        }

        button:hover {

            background: #3458c5;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 18px;

            text-decoration: none;

            color: #4a70e8;
        }

        .back:hover {

            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Enter Bike Details</h1>

        <p class="subtitle">
            Enter the details below to predict the bike price
        </p>


        <!-- VERY IMPORTANT -->
        <!-- Form sends data to /predict -->

        <form action="/predict" method="POST">


            <!-- Kilometers Driven -->

            <div class="form-group">

                <label for="kms_driven">
                    Kilometers Driven
                </label>

                <input
                    type="number"
                    id="kms_driven"
                    name="kms_driven"
                    step="any"
                    placeholder="Enter kilometers driven"
                    required
                >

            </div>


            <!-- Owner -->

            <div class="form-group">

                <label for="owner">
                    Owner
                </label>

                <select
                    id="owner"
                    name="owner"
                    required
                >

                    <option value="">
                        Select Owner
                    </option>

                    <option value="1">
                        First Owner
                    </option>

                    <option value="2">
                        Second Owner
                    </option>

                    <option value="3">
                        Third Owner
                    </option>

                    <option value="4">
                        Fourth Owner
                    </option>

                </select>

            </div>


            <!-- Age -->

            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    step="any"
                    placeholder="Enter bike age"
                    required
                >

            </div>


            <!-- Power -->

            <div class="form-group">

                <label for="power">
                    Power
                </label>

                <input
                    type="number"
                    id="power"
                    name="power"
                    step="any"
                    placeholder="Enter bike power"
                    required
                >

            </div>


            <!-- Brand -->

            <div class="form-group">

                <label for="brand">
                    Brand
                </label>

                <select
                    id="brand"
                    name="brand"
                    required
                >

                    <option value="">
                        Select Brand
                    </option>

                    <option value="1">Brand 1</option>
                    <option value="2">Brand 2</option>
                    <option value="3">Brand 3</option>
                    <option value="4">Brand 4</option>
                    <option value="5">Brand 5</option>
                    <option value="6">Brand 6</option>
                    <option value="7">Brand 7</option>
                    <option value="8">Brand 8</option>
                    <option value="9">Brand 9</option>
                    <option value="10">Brand 10</option>
                    <option value="11">Brand 11</option>
                    <option value="12">Brand 12</option>
                    <option value="13">Brand 13</option>
                    <option value="14">Brand 14</option>
                    <option value="15">Brand 15</option>

                </select>

            </div>


            <!-- Submit -->

            <button type="submit">
                Predict Bike Price
            </button>

        </form>


        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</body>

</html>
